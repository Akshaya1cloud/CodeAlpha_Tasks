<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join Meeting | ConnectX</title>

<link rel="stylesheet" href="css/prejoin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<h1>Join Meeting</h1>

<div class="camera-placeholder">

<i class="fa-solid fa-video-slash"></i>

<p>Camera Preview Disabled</p>

</div>

<div class="buttons">

<button id="cameraToggle">

<i class="fa-solid fa-video"></i>

Camera ON

</button>

<button id="micToggle">

<i class="fa-solid fa-microphone"></i>

Mic ON

</button>

</div>

<button id="joinBtn">

Join Now

</button>

</div>

<script src="js/prejoin.js"></script>

</body>
</html>
