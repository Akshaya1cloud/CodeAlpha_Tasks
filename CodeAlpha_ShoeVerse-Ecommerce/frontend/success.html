<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<link rel="stylesheet" href="css/style.css">

<style>

.success{
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.success-box{
    background:#fff;
    width:500px;
    text-align:center;
    padding:50px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.success-box i{
    font-size:80px;
    color:green;
    margin-bottom:20px;
}

.success-box h1{
    margin-bottom:15px;
}

.success-box p{
    color:#666;
    margin-bottom:30px;
}

.success-box a{
    display:inline-block;
    padding:15px 30px;
    background:#d4af37;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
}

.success-box a:hover{
    background:#111;
}

</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="success">

<div class="success-box">

<i class="fa-solid fa-circle-check"></i>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for shopping with ShoeVerse.
Your order has been confirmed.
</p>

<a href="index.html">
Continue Shopping
</a>

</div>

</div>

</body>
</html>
